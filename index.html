<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LinguaPlay | Fun English Games for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            font-family: 'Quicksand', 'Comic Neue', sans-serif;
            padding: 1rem;
            min-height: 100vh;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 248, 235, 0.98);
            border-radius: 3rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        /* Header */
        .hero {
            background: linear-gradient(135deg, #ff8c42, #e05a1a);
            padding: 1rem 1.5rem;
            text-align: center;
            color: white;
            position: relative;
        }
        .mascot {
            font-size: 3rem;
            animation: bounce 2s infinite;
            display: inline-block;
        }
        @keyframes bounce {
            0%,100%{ transform: translateY(0); }
            50%{ transform: translateY(-8px); }
        }
        .hero h1 {
            font-size: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .voice-status {
            background: #ffc489;
            margin-top: 0.3rem;
            padding: 0.2rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            display: inline-block;
            font-weight: bold;
            color: #5a2a0a;
        }
        .stats-bar {
            background: #fff0d6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 3px solid #ffc489;
        }
        .total-score {
            background: #4caf50;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
        }
        .tab-container {
            display: flex;
            background: #ffe0b5;
            gap: 0.2rem;
            padding: 0.5rem 0.5rem 0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            background: #fff3e0;
            border: none;
            font-size: 1rem;
            transition: 0.2s;
            color: #7b3f12;
            border-radius: 2rem 2rem 0 0;
        }
        .tab.active {
            background: white;
            color: #e06e1a;
            border-bottom: 4px solid #ff9a3c;
        }
        .tab-content {
            display: none;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px);}
            to { opacity: 1; transform: translateY(0);}
        }
        /* Vocabulary Grid */
        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
        }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 0.8rem;
            text-align: center;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            cursor: pointer;
        }
        .card:hover { transform: scale(1.02); background: #fff9ef; }
        .emoji-box {
            background: #fff1e0;
            width: 70px;
            height: 70px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2rem;
            font-size: 3rem;
        }
        .eng-word {
            font-size: 1.2rem;
            font-weight: 800;
            background: #ffefd0;
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            margin: 0.5rem 0;
            color: #b45f2b;
        }
        .audio-btn {
            border: none;
            padding: 5px 10px;
            border-radius: 2rem;
            font-weight: bold;
            background: #ffc857;
            margin: 3px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        /* Conversation */
        .convo-card {
            background: #fffaf0;
            border-radius: 2rem;
            margin-bottom: 1.5rem;
            padding: 0.8rem;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }
        .convo-title {
            font-size: 1.3rem;
            font-weight: 800;
            background: #ffdd99;
            padding: 0.5rem;
            border-radius: 2rem;
            text-align: center;
            margin-bottom: 0.8rem;
        }
        .convo-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 0.5rem;
            border-bottom: 1px dashed #ffcc88;
        }
        .play-all-btn {
            background: #4caf50;
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            margin-left: 1rem;
            cursor: pointer;
        }
        /* Games Section - Enhanced */
        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        .game-card {
            background: linear-gradient(145deg, #ffffff, #fff7e8);
            border-radius: 2.5rem;
            padding: 1.2rem;
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
            text-align: center;
            transition: all 0.2s;
            border: 2px solid #ffd966;
        }
        .game-card:hover {
            transform: scale(1.01);
            box-shadow: 0 20px 30px rgba(0,0,0,0.25);
        }
        .game-title {
            background: #ff9a3c;
            display: inline-block;
            padding: 0.4rem 1.2rem;
            border-radius: 3rem;
            color: white;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            box-shadow: 0 4px 0 #b45a1a;
        }
        .game-question {
            font-size: 3rem;
            margin: 0.5rem 0;
            background: #fef2df;
            border-radius: 2rem;
            padding: 0.5rem;
        }
        .game-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.7rem;
            margin: 1rem 0;
        }
        .game-option {
            background: #f0e6d2;
            padding: 0.6rem 1.2rem;
            border-radius: 3rem;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.1s;
            border: 2px solid #ffb347;
        }
        .game-option:hover { background: #ffd966; transform: scale(1.02); }
        .game-input {
            padding: 0.7rem;
            border-radius: 2rem;
            border: 2px solid #ffb347;
            width: 80%;
            text-align: center;
            font-size: 1rem;
            font-family: inherit;
        }
        .game-feedback {
            margin: 0.8rem 0;
            font-weight: bold;
            font-size: 1rem;
            padding: 0.3rem;
            border-radius: 2rem;
        }
        .game-score {
            background: #2e7d5e;
            color: white;
            border-radius: 2rem;
            padding: 0.2rem 1rem;
            display: inline-block;
            font-weight: bold;
        }
        .game-button {
            background: #ffb347;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: bold;
            margin: 0.3rem;
            cursor: pointer;
        }
        .game-button.success {
            background: #4caf50;
            color: white;
        }
        /* Confetti canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        footer {
            text-align: center;
            padding: 0.8rem;
            background: #ffe6c7;
            font-size: 0.8rem;
        }
        @media (max-width: 750px) {
            .hero h1 { font-size: 1.5rem; }
            .tab { font-size: 0.8rem; }
            .games-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="app-container">
    <div class="hero">
        <div class="mascot">🦊🎮✨</div>
        <h1><i class="fas fa-gamepad"></i> LinguaPlay</h1>
        <div class="voice-status" id="voiceStatus">🎤 Loading English voice...</div>
    </div>
    <div class="stats-bar">
        <span>🌟 Learn English with Games!</span>
        <span class="total-score" id="totalScore">🏆 Total Points: 0</span>
    </div>
    <div class="tab-container">
        <button class="tab active" data-tab="vocab">📚 Words</button>
        <button class="tab" data-tab="convo">💬 Talk</button>
        <button class="tab" data-tab="games">🎮 Games</button>
    </div>

    <div id="vocab" class="tab-content active"><div id="vocabGrid" class="vocab-grid"></div></div>
    <div id="convo" class="tab-content"><div id="convoContainer"></div></div>
    <div id="games" class="tab-content"><div id="gamesContainer"></div></div>
    <footer>🎧 Tap any speaker button to hear the word. Play games, earn points, and have fun!</footer>
</div>

<script>
    // ==================== VOCABULARY (60 words) ====================
    const vocabulary = [
        { emoji: "📖", word: "book", syllables: ["book"] }, { emoji: "🍎", word: "apple", syllables: ["ap","ple"] },
        { emoji: "🐱", word: "cat", syllables: ["cat"] }, { emoji: "🐶", word: "dog", syllables: ["dog"] },
        { emoji: "☀️", word: "sun", syllables: ["sun"] }, { emoji: "🚗", word: "car", syllables: ["car"] },
        { emoji: "🏠", word: "house", syllables: ["house"] }, { emoji: "🌸", word: "flower", syllables: ["flow","er"] },
        { emoji: "🌳", word: "tree", syllables: ["tree"] }, { emoji: "🐦", word: "bird", syllables: ["bird"] },
        { emoji: "🐟", word: "fish", syllables: ["fish"] }, { emoji: "⚽", word: "ball", syllables: ["ball"] },
        { emoji: "🌙", word: "moon", syllables: ["moon"] }, { emoji: "⭐", word: "star", syllables: ["star"] },
        { emoji: "🍌", word: "banana", syllables: ["ba","na","na"] }, { emoji: "🐘", word: "elephant", syllables: ["el","e","phant"] },
        { emoji: "🦁", word: "lion", syllables: ["li","on"] }, { emoji: "🦆", word: "duck", syllables: ["duck"] },
        { emoji: "👟", word: "shoe", syllables: ["shoe"] }, { emoji: "🧢", word: "hat", syllables: ["hat"] },
        { emoji: "🐄", word: "cow", syllables: ["cow"] }, { emoji: "🐒", word: "monkey", syllables: ["mon","key"] },
        { emoji: "🍓", word: "strawberry", syllables: ["straw","ber","ry"] }, { emoji: "🚲", word: "bicycle", syllables: ["bi","cy","cle"] },
        { emoji: "✈️", word: "airplane", syllables: ["air","plane"] }, { emoji: "⏰", word: "clock", syllables: ["clock"] },
        { emoji: "🍕", word: "pizza", syllables: ["piz","za"] }, { emoji: "🐸", word: "frog", syllables: ["frog"] },
        { emoji: "🐝", word: "bee", syllables: ["bee"] }, { emoji: "🌽", word: "corn", syllables: ["corn"] },
        { emoji: "✏️", word: "pen", syllables: ["pen"] }, { emoji: "🪑", word: "chair", syllables: ["chair"] },
        { emoji: "📊", word: "table", syllables: ["ta","ble"] }, { emoji: "🚪", word: "door", syllables: ["door"] },
        { emoji: "🚌", word: "bus", syllables: ["bus"] }, { emoji: "🐔", word: "chicken", syllables: ["chick","en"] },
        { emoji: "🍞", word: "bread", syllables: ["bread"] }, { emoji: "🥛", word: "milk", syllables: ["milk"] },
        { emoji: "🧸", word: "teddy bear", syllables: ["ted","dy","bear"] }, { emoji: "🎈", word: "balloon", syllables: ["bal","loon"] },
        { emoji: "🖍️", word: "crayon", syllables: ["cray","on"] }, { emoji: "📏", word: "ruler", syllables: ["rul","er"] },
        { emoji: "🖌️", word: "paintbrush", syllables: ["paint","brush"] }, { emoji: "🪁", word: "kite", syllables: ["kite"] },
        { emoji: "🍪", word: "cookie", syllables: ["cook","ie"] }, { emoji: "🍦", word: "ice cream", syllables: ["ice","cream"] },
        { emoji: "🥕", word: "carrot", syllables: ["car","rot"] }, { emoji: "🍅", word: "tomato", syllables: ["to","ma","to"] },
        { emoji: "🧀", word: "cheese", syllables: ["cheese"] }, { emoji: "🍔", word: "hamburger", syllables: ["ham","bur","ger"] },
        { emoji: "🥑", word: "avocado", syllables: ["a","vo","ca","do"] }, { emoji: "🥥", word: "coconut", syllables: ["co","co","nut"] },
        { emoji: "🧅", word: "onion", syllables: ["on","ion"] }, { emoji: "🥔", word: "potato", syllables: ["po","ta","to"] },
        { emoji: "🦷", word: "tooth", syllables: ["tooth"] }, { emoji: "🫀", word: "heart", syllables: ["heart"] },
        { emoji: "🧠", word: "brain", syllables: ["brain"] }, { emoji: "👁️", word: "eye", syllables: ["eye"] },
        { emoji: "👂", word: "ear", syllables: ["ear"] }, { emoji: "🤚", word: "hand", syllables: ["hand"] }
    ];

    // ==================== CONVERSATIONS ====================
    const conversations = [
        { title: "👋 Daily Greetings", lines: ["Good morning!", "How are you?", "I am fine, thank you.", "Nice to meet you!", "Goodbye!"] },
        { title: "🛒 At the Market", lines: ["How much is this?", "I would like an apple.", "That is too expensive.", "Here is your change.", "Thank you, have a nice day!"] },
        { title: "🏫 School Time", lines: ["May I come in?", "Where is the teacher?", "I love learning English.", "Can I go to the bathroom?", "Let's read together!"] },
        { title: "👪 Family Fun", lines: ["This is my mother.", "I love my dad.", "Do you have a brother?", "Let's eat dinner.", "Good night, family!"] }
    ];

    // ==================== VOICE (US ENGLISH) ====================
    let selectedVoice = null;
    let voiceRetry = 0;
    function getBestEnglishVoice() {
        const voices = window.speechSynthesis?.getVoices() || [];
        if (!voices.length) return null;
        let best = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Female') || v.name.includes('Zira')));
        if (!best) best = voices.find(v => v.lang === 'en-US');
        if (!best) best = voices.find(v => v.lang.startsWith('en'));
        return best;
    }
    function updateVoice() {
        selectedVoice = getBestEnglishVoice();
        let statusDiv = document.getElementById('voiceStatus');
        if (statusDiv) statusDiv.innerHTML = `🎤 Ready! Speaking: ${selectedVoice ? selectedVoice.name : 'Default English'}`;
    }
    function ensureVoices() {
        let voices = window.speechSynthesis?.getVoices();
        if (voices && voices.length > 0) updateVoice();
        else if (voiceRetry < 15) { voiceRetry++; setTimeout(ensureVoices, 300); }
        else updateVoice();
    }
    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = ensureVoices;
        ensureVoices();
    }

    let autoTimeout = null;
    function stopAllSpeech() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (autoTimeout) clearTimeout(autoTimeout);
    }
    function speakWord(word) {
        stopAllSpeech();
        if (!window.speechSynthesis) return;
        let utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.8;
        if (selectedVoice) utter.voice = selectedVoice;
        window.speechSynthesis.speak(utter);
    }
    function speakSyllables(syllables) {
        stopAllSpeech();
        let idx = 0;
        function next() {
            if (idx >= syllables.length) return;
            let utter = new SpeechSynthesisUtterance(syllables[idx]);
            utter.lang = 'en-US';
            utter.rate = 0.7;
            if (selectedVoice) utter.voice = selectedVoice;
            utter.onend = () => { setTimeout(() => { idx++; next(); }, 400); };
            window.speechSynthesis.speak(utter);
        }
        next();
    }

    // ==================== RENDER VOCAB & CONVO ====================
    function renderVocabulary() {
        let container = document.getElementById('vocabGrid');
        container.innerHTML = '';
        vocabulary.forEach(v => {
            let card = document.createElement('div'); card.className = 'card';
            card.innerHTML = `<div class="emoji-box">${v.emoji}</div><div class="eng-word">${v.word}</div>
                <div><button class="audio-btn" data-word="${v.word}">🔊 Say</button>
                <button class="audio-btn" data-syllables='${JSON.stringify(v.syllables)}'>🔊 Syllables</button></div>`;
            card.querySelector('[data-word]').onclick = () => speakWord(v.word);
            card.querySelector('[data-syllables]').onclick = () => speakSyllables(v.syllables);
            container.appendChild(card);
        });
    }
    function renderConversations() {
        let container = document.getElementById('convoContainer');
        container.innerHTML = '';
        conversations.forEach(conv => {
            let div = document.createElement('div'); div.className = 'convo-card';
            div.innerHTML = `<div class="convo-title">${conv.title} <button class="play-all-btn" data-lines='${JSON.stringify(conv.lines)}'>▶️ Play All</button></div>`;
            let linesDiv = document.createElement('div');
            conv.lines.forEach(line => {
                let lineDiv = document.createElement('div'); lineDiv.className = 'convo-line';
                lineDiv.innerHTML = `<span>${line}</span><button class="audio-btn speak-line">🔊 Speak</button>`;
                lineDiv.querySelector('.speak-line').onclick = () => speakWord(line);
                linesDiv.appendChild(lineDiv);
            });
            div.appendChild(linesDiv);
            container.appendChild(div);
            div.querySelector('.play-all-btn').onclick = (e) => {
                let lines = JSON.parse(e.target.dataset.lines);
                let idx = 0;
                function playNext() {
                    if (idx >= lines.length) return;
                    speakWord(lines[idx]);
                    autoTimeout = setTimeout(() => { idx++; playNext(); }, 1800);
                }
                stopAllSpeech();
                playNext();
            };
        });
    }

    // ==================== GAMES ENGINE (Enhanced) ====================
    let totalPoints = 0;
    function updateTotalScore() { document.getElementById('totalScore').innerText = `🏆 Total Points: ${totalPoints}`; }

    // Confetti effect
    function startConfetti() {
        let canvas = document.getElementById('confettiCanvas');
        let ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 6 + 3, color: `hsl(${Math.random() * 360}, 100%, 60%)`, speedY: Math.random() * 5 + 3, speedX: (Math.random() - 0.5) * 2 });
        }
        let animFrame;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            for (let p of particles) {
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < canvas.height) active = true;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            if (active) animFrame = requestAnimationFrame(draw);
            else cancelAnimationFrame(animFrame);
        }
        draw();
        setTimeout(() => cancelAnimationFrame(animFrame), 1500);
    }

    // Helper: add points with feedback
    function addPoints(amount, element) {
        totalPoints += amount;
        updateTotalScore();
        if (element) {
            let original = element.innerHTML;
            element.innerHTML = `🎉 +${amount} 🎉`;
            setTimeout(() => element.innerHTML = original, 800);
        }
        startConfetti();
    }

    // Get random word
    function getRandomWord() { return vocabulary[Math.floor(Math.random() * vocabulary.length)]; }

    // --- GAME 1: Picture Match ---
    let matchCurrent = null, matchScore = 0, matchAnswered = false;
    function refreshMatchGame() {
        matchCurrent = getRandomWord();
        document.getElementById('matchEmoji').innerHTML = matchCurrent.emoji;
        let options = new Set([matchCurrent.word]);
        while (options.size < 4) options.add(getRandomWord().word);
        let optsArray = Array.from(options).sort(() => Math.random() - 0.5);
        let container = document.getElementById('matchOptions');
        container.innerHTML = '';
        optsArray.forEach(opt => {
            let btn = document.createElement('div'); btn.className = 'game-option';
            btn.innerText = opt;
            btn.onclick = () => {
                if (matchAnswered) return;
                if (opt === matchCurrent.word) {
                    matchScore++;
                    document.getElementById('matchFeedback').innerHTML = '✅ Correct! +10 points!';
                    document.getElementById('matchFeedback').style.background = '#d4f0d4';
                    addPoints(10, document.getElementById('matchScore'));
                    matchAnswered = true;
                } else {
                    document.getElementById('matchFeedback').innerHTML = `❌ It was "${matchCurrent.word}". +5 points for trying!`;
                    document.getElementById('matchFeedback').style.background = '#ffe0e0';
                    addPoints(5, document.getElementById('matchScore'));
                    matchAnswered = true;
                }
                document.getElementById('matchScore').innerText = `🏅 Score: ${matchScore}`;
                setTimeout(() => { refreshMatchGame(); matchAnswered = false; document.getElementById('matchFeedback').innerHTML = ''; }, 1500);
            };
            container.appendChild(btn);
        });
    }

    // --- GAME 2: Spelling Bee ---
    let spellCurrent = null, spellScore = 0, spellAnsweredFlag = false;
    function refreshSpelling() {
        spellCurrent = getRandomWord();
        document.getElementById('spellEmoji').innerHTML = spellCurrent.emoji;
        document.getElementById('spellInput').value = '';
        document.getElementById('spellFeedback').innerHTML = '';
        spellAnsweredFlag = false;
    }
    function checkSpelling() {
        if (spellAnsweredFlag) return;
        let user = document.getElementById('spellInput').value.trim().toLowerCase();
        if (user === spellCurrent.word.toLowerCase()) {
            spellScore++;
            document.getElementById('spellFeedback').innerHTML = '🎉 Perfect! +15 points!';
            document.getElementById('spellFeedback').style.background = '#d4f0d4';
            addPoints(15, document.getElementById('spellScore'));
        } else {
            document.getElementById('spellFeedback').innerHTML = `😢 Correct: "${spellCurrent.word}". +5 points for trying!`;
            document.getElementById('spellFeedback').style.background = '#ffe0e0';
            addPoints(5, document.getElementById('spellScore'));
        }
        spellAnsweredFlag = true;
        document.getElementById('spellScore').innerText = `🏅 Score: ${spellScore}`;
        setTimeout(() => refreshSpelling(), 2000);
    }
    // --- GAME 3: Listening Quiz ---
    let listenCurrent = null, listenScore = 0, listenAnsweredFlag = false;
    function refreshListening() {
        listenCurrent = getRandomWord();
        let options = new Set([listenCurrent.word]);
        while (options.size < 4) options.add(getRandomWord().word);
        let optsArray = Array.from(options).sort(() => Math.random() - 0.5);
        let container = document.getElementById('listenOptions');
        container.innerHTML = '';
        optsArray.forEach(opt => {
            let btn = document.createElement('div'); btn.className = 'game-option';
            btn.innerText = opt;
            btn.onclick = () => {
                if (listenAnsweredFlag) return;
                if (opt === listenCurrent.word) {
                    listenScore++;
                    document.getElementById('listenFeedback').innerHTML = '✅ Great ear! +15 points!';
                    document.getElementById('listenFeedback').style.background = '#d4f0d4';
                    addPoints(15, document.getElementById('listenScore'));
                } else {
                    document.getElementById('listenFeedback').innerHTML = `❌ The word was "${listenCurrent.word}". +5 points!`;
                    document.getElementById('listenFeedback').style.background = '#ffe0e0';
                    addPoints(5, document.getElementById('listenScore'));
                }
                listenAnsweredFlag = true;
                document.getElementById('listenScore').innerText = `🏅 Score: ${listenScore}`;
                setTimeout(() => { refreshListening(); listenAnsweredFlag = false; document.getElementById('listenFeedback').innerHTML = ''; }, 1500);
            };
            container.appendChild(btn);
        });
    }
    function playListenWord() { if (listenCurrent) speakWord(listenCurrent.word); }

    // --- GAME 4: Word Scramble ---
    let scrambleCurrent = null, scrambleScore = 0, scrambleAnsweredFlag = false;
    function scrambleWord(word) {
        let arr = word.split('');
        for (let i = arr.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        let scrambled = arr.join('');
        return scrambled === word ? scrambleWord(word) : scrambled;
    }
    function refreshScramble() {
        scrambleCurrent = getRandomWord();
        let scrambled = scrambleWord(scrambleCurrent.word);
        document.getElementById('scrambleQuestion').innerHTML = `🔀 ${scrambled.toUpperCase()}`;
        document.getElementById('scrambleInput').value = '';
        document.getElementById('scrambleFeedback').innerHTML = '';
        scrambleAnsweredFlag = false;
    }
    function checkScramble() {
        if (scrambleAnsweredFlag) return;
        let user = document.getElementById('scrambleInput').value.trim().toLowerCase();
        if (user === scrambleCurrent.word.toLowerCase()) {
            scrambleScore++;
            document.getElementById('scrambleFeedback').innerHTML = '🎉 Unscrambled! +15 points!';
            document.getElementById('scrambleFeedback').style.background = '#d4f0d4';
            addPoints(15, document.getElementById('scrambleScore'));
        } else {
            document.getElementById('scrambleFeedback').innerHTML = `😢 Correct: "${scrambleCurrent.word}". +5 points!`;
            document.getElementById('scrambleFeedback').style.background = '#ffe0e0';
            addPoints(5, document.getElementById('scrambleScore'));
        }
        scrambleAnsweredFlag = true;
        document.getElementById('scrambleScore').innerText = `🏅 Score: ${scrambleScore}`;
        setTimeout(() => refreshScramble(), 2000);
    }

    // Render all games dynamically
    function renderGames() {
        let container = document.getElementById('gamesContainer');
        container.innerHTML = `
            <div class="games-container">
                <div class="game-card"><div class="game-title">🧩 Picture Match</div>
                    <div class="game-question" id="matchEmoji">🐶</div>
                    <div class="game-options" id="matchOptions"></div>
                    <div class="game-feedback" id="matchFeedback"></div>
                    <div><span class="game-score" id="matchScore">🏅 Score: 0</span></div>
                    <button class="game-button" id="nextMatchBtn">➡️ Next Word</button>
                </div>
                <div class="game-card"><div class="game-title">✏️ Spelling Bee</div>
                    <div class="game-question" id="spellEmoji">🐱</div>
                    <input type="text" id="spellInput" class="game-input" placeholder="Type the word...">
                    <button class="game-button success" id="checkSpellBtn">✔️ Check</button>
                    <div class="game-feedback" id="spellFeedback"></div>
                    <div><span class="game-score" id="spellScore">🏅 Score: 0</span></div>
                    <button class="game-button" id="nextSpellBtn">🔄 New Word</button>
                </div>
                <div class="game-card"><div class="game-title">🎧 Listening Quiz</div>
                    <div class="game-question"><i class="fas fa-volume-up" style="font-size:2.5rem;"></i></div>
                    <button class="game-button success" id="playListenBtn">🔊 Play Sound</button>
                    <div class="game-options" id="listenOptions"></div>
                    <div class="game-feedback" id="listenFeedback"></div>
                    <div><span class="game-score" id="listenScore">🏅 Score: 0</span></div>
                    <button class="game-button" id="nextListenBtn">🎲 Next Question</button>
                </div>
                <div class="game-card"><div class="game-title">🔄 Word Scramble</div>
                    <div class="game-question" id="scrambleQuestion">🔀 EPLPA</div>
                    <input type="text" id="scrambleInput" class="game-input" placeholder="Unscramble the word...">
                    <button class="game-button success" id="checkScrambleBtn">✔️ Check</button>
                    <div class="game-feedback" id="scrambleFeedback"></div>
                    <div><span class="game-score" id="scrambleScore">🏅 Score: 0</span></div>
                    <button class="game-button" id="nextScrambleBtn">🔄 New Word</button>
                </div>
            </div>
        `;
        // Attach events
        document.getElementById('nextMatchBtn').onclick = () => { refreshMatchGame(); matchAnswered = false; };
        document.getElementById('checkSpellBtn').onclick = checkSpelling;
        document.getElementById('nextSpellBtn').onclick = () => refreshSpelling();
        document.getElementById('playListenBtn').onclick = playListenWord;
        document.getElementById('nextListenBtn').onclick = () => { refreshListening(); listenAnsweredFlag = false; };
        document.getElementById('checkScrambleBtn').onclick = checkScramble;
        document.getElementById('nextScrambleBtn').onclick = () => refreshScramble();
        // Initialize
        refreshMatchGame(); refreshSpelling(); refreshListening(); refreshScramble();
        matchScore = 0; spellScore = 0; listenScore = 0; scrambleScore = 0;
        document.getElementById('matchScore').innerText = '🏅 Score: 0';
        document.getElementById('spellScore').innerText = '🏅 Score: 0';
        document.getElementById('listenScore').innerText = '🏅 Score: 0';
        document.getElementById('scrambleScore').innerText = '🏅 Score: 0';
    }

    // ==================== TABS ====================
    function initTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                let tabId = tab.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                stopAllSpeech();
                if (tabId === 'games') renderGames();
            });
        });
    }

    renderVocabulary();
    renderConversations();
    initTabs();
    renderGames(); // initial games load
    window.addEventListener('beforeunload', () => stopAllSpeech());
</script>
